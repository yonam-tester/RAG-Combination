[pytest]
asyncio_mode = auto
markers =
    integration: 실제 Qdrant 서버가 필요한 통합 테스트
; litellm==1.40.11이 pydantic 모델에 class-based Config를 써서 `import litellm` 시점에
; PydanticDeprecatedSince20 경고가 뜬다. litellm 쪽 이슈이고 임포트 시점(collection 단계)에
; 발생해 pytestmark 방식으로는 못 잡으므로 ini 레벨에서 숨긴다.
filterwarnings =
    ignore:Support for class-based .config. is deprecated.*:DeprecationWarning
