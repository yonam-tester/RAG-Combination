services:
  nginx:
    image: nginx:stable-alpine
    container_name: yeonam-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - rag-server
    networks:
      - yeonam-network
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yeonam-backend
    expose:
      - "8080"
    env_file:
      - .env
    volumes:
      - backend_data:/app/data
    networks:
      - yeonam-network
    restart: always

  rag-server:
    build:
      context: ./rag_server
      dockerfile: Dockerfile
    container_name: yeonam-rag
    ports:
      - "8000:8000"
    expose:
      - "8000"
    env_file:
      - .env
    networks:
      - yeonam-network
    restart: always

  minio:
    image: minio/minio:RELEASE.2024-02-17T01-15-57Z
    container_name: yeonam-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - yeonam-network
    restart: always

  llm-server:
    build:
      context: ./llm_server
      dockerfile: Dockerfile
    container_name: yeonam-llm
    ports:
      - "8001:8000"
    expose:
      - "8000"
    env_file:
      - .env
    networks:
      - yeonam-network
    restart: always
    labels:
      app: yeonam
      component: llm-server
      phase: "1"

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: yeonam-prometheus
    expose:
      - "9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - yeonam-network
    restart: always
    labels:
      app: yeonam
      component: prometheus
      phase: "1"

  grafana:
    image: grafana/grafana:10.4.0
    container_name: yeonam-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - yeonam-network
    restart: always
    labels:
      app: yeonam
      component: grafana
      phase: "1"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: yeonam-cadvisor
    expose:
      - "8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - yeonam-network
    restart: always
    labels:
      app: yeonam
      component: cadvisor
      phase: "1"

  pushgateway:
    image: prom/pushgateway:v1.8.0
    container_name: yeonam-pushgateway
    ports:
      - "9091:9091"
    networks:
      - yeonam-network
    restart: always
    labels:
      app: yeonam
      component: pushgateway
      phase: "1"

networks:
  yeonam-network:
    driver: bridge

volumes:
  backend_data:
  minio_data:
  prometheus_data:
  grafana_data:
